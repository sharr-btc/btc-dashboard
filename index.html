<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTC Fundamental Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0b0b0b;--line:#2a2a2a;--ink:#f2f2f2;--mute:#9a9a9a;--up:#22c55e;--dn:#ef4444;--mid:#eab308;--acc:#f7931a;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f5f5f3;--card:#fff;--line:#dcdcd8;--ink:#161616;--mute:#666;--up:#15803d;--dn:#b91c1c;--mid:#a16207;--acc:#c2410c;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Myanmar',system-ui,sans-serif;line-height:1.65;font-size:14px}
.shell{max-width:640px;margin:0 auto;padding:16px}
.panel{border:1px solid var(--line);border-radius:16px;padding:16px}
h1{font-size:15px;margin:0 0 6px}
h2{font-size:12px;letter-spacing:.06em;color:var(--mute);margin:18px 0 8px;font-weight:600}
.sm{font-size:12px;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;display:inline-block}
.up{color:var(--up)}.dn{color:var(--dn)}.mid{color:var(--mid)}
.src{font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}
.item{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.item:hover{border-color:var(--mute)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.back{font:inherit;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer;margin-bottom:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.warn{border:1px solid var(--mid);color:var(--mid);border-radius:10px;padding:8px 12px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;border-top:0}
.scroll{overflow-x:auto}
.big{font-size:22px;font-weight:700}
.chip{font:inherit;font-size:11px;background:none;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-left:4px;cursor:pointer}
.chip.on{color:var(--ink);border-color:var(--acc)}
</style>
</head>
<body>
<div class="shell"><div class="panel" id="app">Loading...</div></div>
<script>
var D=null;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n(x,d){return x==null?"-":Number(x).toLocaleString("en-US",{maximumFractionDigits:d==null?0:d})}
function pct(x){return x==null?"-":(x>0?"+":"")+Number(x).toFixed(2)+"%"}
function pp(x){return x==null?"-":(x>0?"+":"")+Number(x).toFixed(2)+" pp"}
function ym(d){return d?String(d).slice(0,7):"-"}
function bcls(l){l=String(l||"").toUpperCase();if(/BEAR|NEGATIVE|FEAR|WEAK|CONTRACT|EASING/.test(l))return "dn";if(/BULL|POSITIVE|GREED|EXPAND|RISING/.test(l))return "up";return "mid"}
function ageDays(d){return d?Math.floor((Date.now()-new Date(d+"T23:59:59Z").getTime())/864e5):null}
function badge(l){return "<span class='badge "+bcls(l)+"'>"+esc(l)+"</span>"}
function back(to,t){return "<button class='back' data-go='"+to+"'>\u2039 "+t+"</button>"}
function rowsTbl(rows){return "<div class='box scroll'><table>"+rows.map(function(r){return "<tr><td>"+esc(r[0])+"</td><td>"+esc(r[1])+"</td></tr>"}).join("")+"</table></div>"}

function home(){
  var r=D.rules||{},man=D.manual||{},f=D.fng,sc=D.stablecoins,nw=D.network,mm=r.macro;
  var cards=[
   {id:"etf",name:"ETF Flow",mode:"M",d:man.etf&&man.etf.as_of,label:man.etf&&man.etf.bias,sub:man.etf&&man.etf.headline},
   {id:"macro",name:"Macro",mode:"A",label:mm&&mm.label,sub:mm?"Rule Score "+(mm.score>0?"+":"")+mm.score+" (-3 ကနေ +3)":"FRED ဒေတာ မရသေး"},
   {id:"onchain",name:"On-chain (Network)",mode:"P",label:r.difficulty_trend&&("DIFFICULTY "+r.difficulty_trend),sub:nw?"Hash rate "+n(nw.hashrate_ehs)+" EH/s":null},
   {id:"sent",name:"Sentiment",mode:"A",label:r.fng_zone,sub:f?"Fear & Greed "+f.value+"/100":null},
   {id:"sd",name:"Supply & Demand",mode:"P",label:r.stablecoin_trend&&("STABLECOIN "+r.stablecoin_trend),sub:sc?"30D "+pct(sc.change_30d_pct):null},
   {id:"news",name:"News",mode:"M",d:man.news&&man.news.as_of,label:man.news&&man.news.bias,sub:man.news&&man.news.headline}
  ];
  var h="<h1>BTC FUNDAMENTAL ANALYSIS</h1><div class='sm'>နောက်ဆုံး Auto Update: "+new Date(D.updated_utc).toLocaleString()+"</div>";
  var ek=Object.keys(D.errors||{});
  if(ek.length)h+="<div class='warn'>ယူမရတဲ့ Source: "+ek.map(esc).join(", ")+"</div>";
  h+="<h2>MODULES</h2>";
  cards.forEach(function(c){
    var tag=c.mode==="A"?"AUTO":c.mode==="P"?"AUTO (တစ်စိတ်တစ်ပိုင်း)":"MANUAL \u00b7 "+(c.d||"-");
    var old=c.mode==="M"&&ageDays(c.d)>3?"<div class='sm mid'>ဒေတာ "+ageDays(c.d)+" ရက် ဟောင်းနေပါပြီ</div>":"";
    h+="<button class='item' data-go='"+c.id+"'><div class='r'><b>"+c.name+"</b>"+(c.label?badge(c.label):"<span class='sm'>-</span>")+"</div><div class='r' style='margin-top:6px'><span class='sm'>"+esc(c.sub||"")+"</span><span class='src'>"+tag+"</span></div>"+old+"</button>";
  });
  return h+"<div class='sm'>Bias တံဆိပ်တွေက Rule-based သို့ ကျွန်တော့်အကဲဖြတ်ချက်ဖြစ်ပြီး Trading Signal မဟုတ်ပါ။ AUTO = တစ်နာရီတစ်ခါ အလိုအလျောက်၊ MANUAL = လက်နဲ့ Update (ရက်စွဲကြည့်ပါ)။</div>";
}

var MD={
 fed:{t:"Fed Target Rate",series:"DFEDTARU / DFEDTARL",why:"အတိုးနှုန်း မြင့်လာရင် Risk asset (BTC အပါအဝင်) အပေါ် ဖိအားပေးတတ်ပြီး လျှော့လာရင် အားပေးတတ်ပါတယ်။"},
 us10y:{t:"US 10Y Treasury Yield",series:"DGS10",why:"Yield မြင့်ရင် အန္တရာယ်မရှိတဲ့ ရင်းနှီးမြှုပ်နှံမှုက ပိုဆွဲဆောင်မှုရှိလာပြီး BTC လို Risk asset ကို ဖိအားပေးတတ်ပါတယ်။"},
 cpi:{t:"CPI (Headline)",series:"CPIAUCSL",why:"Inflation အပူလွန်ရင် Fed က အတိုးနှုန်း တင်ဖို့ ဖိအားပေးခံရပါတယ်။"},
 core:{t:"Core CPI",series:"CPILFESL",why:"စားသောက်ကုန်နဲ့ စွမ်းအင်ကို ချန်ထားတဲ့ Inflation ဖြစ်ပြီး Fed က အနီးကပ် ကြည့်ပါတယ်။"},
 nfp:{t:"NFP နဲ့ Unemployment",series:"PAYEMS / UNRATE",why:"အလုပ်အကိုင် ခိုင်မာရင် Fed က အတိုးနှုန်း မြင့်ထားရန် အကြောင်းပြချက် ရနိုင်ပါတယ်။"}
};
function mdRows(k,m){
  if(k==="fed")return [["Target Range",Number(m.fed_lower).toFixed(2)+" - "+Number(m.fed_upper).toFixed(2)+"%"],["6 လ ပြောင်းလဲမှု",pp(m.fed_change_6m_pp)],["Observation Date",m.fed_date]];
  if(k==="us10y")return [["Yield",Number(m.us10y).toFixed(2)+"%"],["Observation Date",m.us10y_date]];
  if(k==="cpi")return [["လချင်း (m/m)",pct(m.cpi_mom_pct)],["နှစ်ချင်း (y/y)",m.cpi_yoy_pct==null?"မရနိုင် (ပြီးခဲ့တဲ့နှစ် အခြေခံဒေတာ မရှိ)":pct(m.cpi_yoy_pct)],["လ",ym(m.cpi_date)]];
  if(k==="core")return [["လချင်း (m/m)",pct(m.core_mom_pct)],["နှစ်ချင်း (y/y)",m.core_yoy_pct==null?"မရနိုင် (ပြီးခဲ့တဲ့နှစ် အခြေခံဒေတာ မရှိ)":pct(m.core_yoy_pct)],["လ",ym(m.core_date)]];
  return [["NFP လချင်း ပြောင်းလဲမှု",(m.nfp_change_k>0?"+":"")+n(m.nfp_change_k)+"K"],["Unemployment",n(m.unemployment_pct,1)+"%"],["လ",ym(m.nfp_date)]];
}
function macro(){
  var m=D.macro,mm=(D.rules||{}).macro;
  if(!m)return back("home","နောက်သို့")+"<h1>MACRO</h1><div class='warn'>FRED ဒေတာ မရသေးပါ။ FRED_API_KEY ကို GitHub Secrets ထဲ စစ်ပါ။</div>";
  var h=back("home","နောက်သို့")+"<div class='top'><h1>MACRO</h1><span class='src'>AUTO \u00b7 FRED</span></div>";
  if(mm){
    h+="<div class='box'><div class='sm'>RULE-BASED BIAS</div><div class='big "+bcls(mm.label)+"'>"+esc(mm.label)+"</div><div class='sm'>Score "+(mm.score>0?"+":"")+mm.score+" (-3 ကနေ +3)</div></div>";
    h+="<h2>ဘယ်လို တွက်လဲ</h2><div class='box scroll'><table><tr><th>အချက်</th><th>တန်ဖိုး</th><th>Pts</th><th>အကြောင်းပြချက်</th></tr>"+mm.parts.map(function(p){return "<tr><td>"+esc(p.name)+"</td><td>"+esc(p.value)+"</td><td class='"+(p.points>0?"up":p.points<0?"dn":"mid")+"'>"+(p.points>0?"+":"")+p.points+"</td><td>"+esc(p.reason)+"</td></tr>"}).join("")+"</table></div><div class='sm'>-2 နှင့်အောက် = BEARISH၊ +2 နှင့်အထက် = BULLISH၊ ကြားထဲ = MIXED။ "+esc(mm.note)+"။</div>";
  }
  h+="<h2>INDICATORS</h2>";
  Object.keys(MD).forEach(function(k){
    var v=mdRows(k,m)[0];
    h+="<button class='item' data-go='macro-"+k+"'><div class='r'><b>"+MD[k].t+"</b><span class='chev'>\u203a</span></div><div class='sm'>"+esc(v[0])+": "+esc(v[1])+"</div></button>";
  });
  return h+"<div class='sm'>မရသေးသော အပိုင်း: Economic Calendar၊ DXY (Licensed Data လို)၊ Liquidity။</div>";
}
function macroDetail(k){
  var m=D.macro;if(!m||!MD[k])return macro();
  return back("macro","Macro")+"<div class='top'><h1>"+MD[k].t+"</h1><span class='src'>AUTO \u00b7 FRED</span></div>"+rowsTbl(mdRows(k,m))+(k==="us10y"?chart("US 10Y Yield","y10",function(v){return Number(v).toFixed(2)+"%"},true):"")+"<h2>BTC အတွက် အဓိပ္ပာယ်</h2><div class='box'>"+MD[k].why+"</div><h2>SOURCE</h2><div class='box sm'>FRED (St. Louis Fed) \u00b7 Series: "+MD[k].series+"<br>ဒေတာ ထွက်တာနဲ့ အဆင့်ဆင့် နောက်ကျနိုင်ပါတယ် (အချို့က ၁ ရက်ခန့်)။</div>";
}
var RNG=30;
function chips(){return [7,30,90].map(function(d){return "<button class='chip"+(RNG===d?" on":"")+"' data-range='"+d+"'>"+d+"D</button>"}).join("")}
function chart(title,key,fmt,diff){
  var s=(D.series||{})[key],h="<div class='box'><div class='top'><b>"+title+"</b><span>"+chips()+"</span></div>";
  if(!s||s.length<2)return h+"<div class='sm' style='margin-top:6px'>မှတ်တမ်းဒေတာ မရသေးပါ။</div></div>";
  var a=s.slice(-(RNG+1)),v=a.map(function(p){return p[1]}),mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),W=300,H=90,P=4,rg=(mx-mn)||1;
  var pts=a.map(function(p,i){return (P+i*(W-2*P)/(a.length-1)).toFixed(1)+","+(P+(H-2*P)*(1-(p[1]-mn)/rg)).toFixed(1)}).join(" ");
  var last=v[v.length-1],first=v[0],ch=diff?(last-first):(first?(last/first-1)*100:null);
  var chTxt=ch==null?"":(diff?(ch>0?"+":"")+Number(ch).toFixed(0):pct(ch));
  h+="<div class='r' style='margin-top:4px'><span class='big'>"+fmt(last)+"</span><span class='"+(ch>0?"up":ch<0?"dn":"mid")+"'>"+chTxt+" ("+(a.length-1)+" ရက်)</span></div>";
  h+="<svg viewBox='0 0 "+W+" "+H+"' width='100%' height='110' preserveAspectRatio='none' style='display:block;margin:6px 0'><polyline points='"+pts+"' fill='none' stroke='var(--acc)' stroke-width='1.6' vector-effect='non-scaling-stroke'/></svg>";
  h+="<div class='r sm'><span>"+a[0][0]+"</span><span>"+a[a.length-1][0]+"</span></div><div class='sm'>အနိမ့်ဆုံး "+fmt(mn)+" \u00b7 အမြင့်ဆုံး "+fmt(mx)+"</div></div>";
  return h;
}
function mdata(id){return (D.manual||{})[id]||null}
function tg(t){return "<span class='src'>"+t+"</span>"}
function kv3(rows){return "<div class='box scroll'><table>"+rows.map(function(r){return "<tr><td>"+esc(r[0])+"</td><td>"+esc(r[1])+"</td><td>"+tg(r[2])+"</td></tr>"}).join("")+"</table></div>"}
function manRows(x){return kv3(((x&&x.rows)||[]).map(function(r){return [r[0],r[1],"MANUAL"]}))}
function notesBox(x){return x&&x.notes&&x.notes.length?"<div class='box sm'>"+x.notes.map(function(t){return "\u2022 "+esc(t)}).join("<br>")+"</div>":""}
function ncBox(x){return x&&x.not_collected&&x.not_collected.length?"<div class='box sm'><b>မစုဆောင်းရသေးသော အချက်များ</b><br>"+x.not_collected.map(esc).join(" \u00b7 ")+"</div>":""}
function staleBox(x){var a=x?ageDays(x.as_of):null;return a!=null&&a>3?"<div class='warn'>လက်စွဲဒေတာ "+a+" ရက် ဟောင်းနေပါပြီ ("+esc(x.as_of)+")။ \"Update လုပ်ပေး\" လို့ ပြောပါ။</div>":""}
function src(x){return x&&x.source?"<div class='sm'>Source: "+esc(x.source)+(x.as_of?" \u00b7 လက်စွဲ ရက်စွဲ "+esc(x.as_of):"")+"</div>":""}
function head(name,tag,label){return back("home","နောက်သို့")+"<div class='top'><h1>"+name+"</h1>"+tg(tag)+"</div>"+(label?"<div class='box'><div class='big "+bcls(label.v)+"'>"+esc(label.v)+"</div><div class='sm'>"+esc(label.s)+"</div></div>":"")}

function modPage(id){
  var x=mdata(id),r=D.rules||{},f=D.fng,nw=D.network,s=D.supply,sc=D.stablecoins,p=D.price,h="",auto=[];
  if(id==="etf"){
    h=head("ETF Flow","MANUAL",x&&{v:x.bias,s:"ကျွန်တော့်အကဲဖြတ်ချက် \u00b7 "+x.as_of+" \u00b7 Formula Score မဟုတ်"});
    if(!x)return h+"<div class='warn'>ဒေတာ မရှိသေးပါ။</div>";
    h+=staleBox(x)+"<h2>အကျဉ်းချုပ်</h2>"+manRows(x);
    h+="<h2>ETF BREAKDOWN</h2><div class='box scroll'><table><tr><th>ETF</th><th>Net Flow</th><th>Status</th><th>AUM</th></tr>"+(x.breakdown||[]).map(function(b){return "<tr><td><b>"+esc(b[0])+"</b></td><td>"+esc(b[1])+"</td><td class='"+(b[2]==="Outflow"?"dn":b[2]==="Inflow"?"up":"mid")+"'>"+esc(b[2])+"</td><td>"+esc(b[3])+"</td></tr>"}).join("")+"</table></div>";
    return h+notesBox(x)+ncBox(x)+src(x);
  }
  if(id==="sent"){
    var z=r.fng_zone;
    h=head("Sentiment","AUTO + MANUAL",z&&{v:z,s:"Rule-based (Fear & Greed) \u00b7 Buy Signal မဟုတ်"});
    if(f)auto.push(["Fear & Greed Index",f.value+"/100 ("+(z||f.label)+")","AUTO"],["အရင်နေ့",String(f.previous),"AUTO"]);
    if(p)auto.push(["BTC ဈေး (24h)","$"+n(p.usd)+" ("+pct(p.change_24h_pct)+")","AUTO"]);
    h+="<h2>အလိုအလျောက်</h2>"+(auto.length?kv3(auto):"<div class='warn'>ဒေတာ မရသေးပါ။</div>");
    h+=chart("Fear & Greed Index","fng",function(v){return String(v)},true)+chart("BTC ဈေး (USD)","price",function(v){return "$"+n(v)});
    if(x)h+=staleBox(x)+"<h2>လက်စွဲ Update</h2>"+manRows(x)+notesBox(x)+ncBox(x)+src(x);
    return h;
  }
  if(id==="onchain"){
    h=head("On-chain","AUTO + MANUAL",x&&x.assessment&&{v:x.assessment,s:"ကျွန်တော့်အကဲဖြတ်ချက် \u00b7 "+x.as_of}||(r.difficulty_trend?{v:"DIFFICULTY "+r.difficulty_trend,s:"Rule-based"}:null));
    if(nw)auto.push(["Block Height",n(nw.height),"AUTO"],["Hash Rate",n(nw.hashrate_ehs)+" EH/s","AUTO"],["Difficulty",n(nw.difficulty/1e12,2)+"T","AUTO"],["နောက်ဆုံး Difficulty ပြောင်းလဲမှု",pct(nw.last_retarget_pct)+" ("+(r.difficulty_trend||"-")+")","AUTO"],["နောက်တစ်ကြိမ် ခန့်မှန်း",pct(nw.next_retarget_est_pct),"AUTO"]);
    h+="<h2>NETWORK (အလိုအလျောက်)</h2>"+(auto.length?kv3(auto):"<div class='warn'>ဒေတာ မရသေးပါ။</div>");
    h+=chart("Hash Rate (EH/s)","hashrate",function(v){return n(v)+" EH/s"});
    if(x)h+=staleBox(x)+"<h2>HOLDER / MINER (လက်စွဲ Update)</h2>"+manRows(x)+notesBox(x)+ncBox(x)+src(x);
    return h;
  }
  if(id==="sd"){
    h=head("Supply & Demand","AUTO + MANUAL",x&&x.assessment&&{v:x.assessment,s:"ကျွန်တော့်အကဲဖြတ်ချက် \u00b7 "+x.as_of}||(r.stablecoin_trend?{v:"STABLECOIN "+r.stablecoin_trend,s:"Rule-based"}:null));
    if(s)auto.push(["လည်ပတ်နေသော BTC",n(s.circulating),"AUTO"],["နေ့စဉ်အသစ်ထွက်",n(s.daily_issuance)+" BTC","AUTO"],["နှစ်စဉ် Inflation",Number(s.annual_inflation_pct).toFixed(2)+"%","AUTO"]);
    if(sc)auto.push(["Stablecoin Supply","$"+n(sc.total_usd/1e9,1)+"B","AUTO"],["Stablecoin 30D",pct(sc.change_30d_pct)+" ($"+n(sc.change_30d_usd/1e9,1)+"B)","AUTO"],["Stablecoin 7D",pct(sc.change_7d_pct),"AUTO"]);
    h+="<h2>SUPPLY (အလိုအလျောက်)</h2>"+(auto.length?kv3(auto):"<div class='warn'>ဒေတာ မရသေးပါ။</div>");
    h+=chart("Stablecoin Supply ($B)","stablecoins",function(v){return "$"+Number(v).toFixed(1)+"B"});
    if(x)h+=staleBox(x)+"<h2>DEMAND (လက်စွဲ Update)</h2>"+manRows(x)+notesBox(x)+ncBox(x)+src(x);
    return h;
  }
  if(id==="news"){
    h=head("News","MANUAL",x&&{v:x.bias,s:"ကျွန်တော့်အကဲဖြတ်ချက် \u00b7 "+x.as_of+" \u00b7 Formal Score မတွက်"});
    if(!x||!x.items)return h+"<div class='warn'>ဒေတာ မရှိသေးပါ။</div>";
    h+=staleBox(x)+"<h2>EVENTS</h2>";
    x.items.forEach(function(it,i){h+="<button class='item' data-go='news-"+i+"'><div class='r'><span class='sm'>"+esc(it.cat)+"</span>"+badge(it.sentiment)+"</div><b>"+esc(it.title)+"</b><div class='sm'>Impact: "+esc(it.impact)+" \u00b7 "+esc(it.verification)+"</div></button>"});
    return h+notesBox(x);
  }
  return back("home","နောက်သို့")+"<div class='warn'>ဒီစာမျက်နှာ မရှိပါ။</div>";
}
function newsDetail(i){
  var x=mdata("news"),it=x&&x.items&&x.items[+i];
  if(!it)return modPage("news");
  var h=back("news","News")+"<div class='top'><span class='src'>MANUAL \u00b7 "+esc(x.as_of)+"</span></div><h1 style='margin-top:8px'>"+esc(it.title)+"</h1><div>"+badge(it.sentiment)+" "+badge(it.impact+" IMPACT")+" <span class='src'>"+esc(it.cat)+"</span></div>";
  h+="<h2>1. အကျဉ်းချုပ်</h2><div class='box'>"+esc(it.summary)+"</div>";
  h+="<h2>2. ဘာဖြစ်ခဲ့လဲ</h2><div class='box'>"+it.what.map(esc).join("<br>")+"</div>";
  h+="<h2>3. BTC အပေါ် သက်ရောက်မှု</h2><div class='box'>"+esc(it.ai)+"<br><br><span class='sm'>Bullish အချက်</span><br>"+esc(it.bull)+"<br><span class='sm'>Bearish အချက်</span><br>"+esc(it.bear)+"</div>";
  h+="<h2>4. အတည်ပြုချက်</h2><div class='box'><div class='top'><span class='sm'>Status</span>"+badge(it.verification)+"</div><div class='sm' style='margin-top:6px'>"+esc(it.vnote)+"</div></div>";
  return h+"<div class='sm'>Source: "+esc(it.source)+"</div><div class='sm'>Sentiment ကနေ Impact ကို ခွဲပြထားပါတယ်။ Price Reaction ကို မစုဆောင်းရသေးပါ။</div>";
}
function render(){
  if(!D)return;
  var k=(location.hash||"").replace("#","")||"home",h;
  if(k==="home")h=home();
  else if(k==="macro")h=macro();
  else if(k.indexOf("macro-")===0)h=macroDetail(k.slice(6));
  else if(k.indexOf("news-")===0)h=newsDetail(k.slice(5));else h=modPage(k);
  document.getElementById("app").innerHTML=h;
}
document.getElementById("app").addEventListener("click",function(e){var rb=e.target.closest("[data-range]");if(rb){RNG=+rb.getAttribute("data-range");render();return}var b=e.target.closest("[data-go]");if(b){var g=b.getAttribute("data-go");location.hash=g==="home"?"":g;if(!location.hash)render();window.scrollTo(0,0)}});
window.addEventListener("hashchange",render);
function load(){
  fetch("data.json?t="+Date.now()).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){D=d;render()}).catch(function(e){document.getElementById("app").textContent="data.json ဖတ်မရပါ: "+e.message});
}
load();setInterval(load,300000);
</script>
</body>
</html>
